name: qr_scanner_bridge
description: Puente Flutter (MethodChannel) hacia el SDK Android de lectura de QR de productos.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.qrpedidos.qr_scanner_bridge
        pluginClass: QrScannerBridgePlugin
